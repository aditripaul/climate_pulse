data:
  dir: "./datasets"
  start_year: 1950
  end_year: 2026
  focus_countries: "IND,USA"
  openaq_max_locations: 200
  openaq_limit: 10000
  historical_stream_limit: 0

model:
  checkpoint_dir: "./runtime/models/checkpoints"
  device: "auto"
  max_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  log_frequency: 1
  seed: 42
  # TFT hyperparameters
  tft_hidden_size: 32
  tft_attention_head_size: 4
  tft_dropout: 0.1
  tft_encoder_length: 60
  tft_prediction_months: 12
  tft_use_year: false
  # LSTM hyperparameters
  lstm_hidden_size: 64
  lstm_num_layers: 2
  lstm_encoder_length: 60
  lstm_prediction_months: 12
  lstm_bidirectional: true
  # ST-GNN hyperparameters
  gnn_num_periods: 7
  gnn_hidden_channels: 32

nwm:
  num_mesh_nodes: 2000
  hidden_dim: 128
  num_processor_layers: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  conditioning: "observed"   # observed | forecast | none
  area_weighted_loss: true

log:
  level: "INFO"
  dir: "./runtime/logs"
