data:
  dir: "./datasets"
  start_year: 1950
  end_year: 2026
  focus_countries: "IND,USA"
  openaq_max_locations: 200
  openaq_limit: 10000
  historical_stream_limit: 0

tft:
  hidden_size: 32
  lstm_layers: 1
  num_attention_heads: 4
  dropout: 0.3
  hidden_continuous_size: 16

model:
  # TFT hyperparameters
  tft_hidden_size: 32
  tft_attention_head_size: 4
  tft_dropout: 0.3
  tft_encoder_length: 120
  tft_prediction_months: 12
  # LSTM hyperparameters
  lstm_hidden_size: 64
  lstm_num_layers: 2
  lstm_encoder_length: 60
  lstm_prediction_months: 12
  lstm_bidirectional: true
  # ST-GNN hyperparameters
  gnn_num_periods: 7
