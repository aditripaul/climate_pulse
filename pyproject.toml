[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-pulse"
version = "0.1.0"
description = "AI-Powered Global Climate Forecasting and Analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Core runtime dependencies.
# torch, torch-scatter, and torch-sparse are intentionally omitted here
# because they require hardware-specific index URLs (CUDA / ROCm / CPU).
# They are installed separately in the Makefile before this package.
# torch-geometric >=2.8.0 uses pyg-lib instead of torch-scatter/torch-sparse.
dependencies = [
    # Deep learning
    "torch>=2.4.0",
    "torch_geometric>=2.8.0",
    "torch-geometric-temporal",
    "pytorch-forecasting>=1.8.0",
    # Note: pytorch-lightning is a transitive dependency of pytorch-forecasting
    # (used to drive TFT training). It is intentionally not pinned explicitly
    # here to avoid the supply-chain compromised versions 2.6.2 / 2.6.3.
    # pytorch-forecasting >=1.8.0 already requires a safe version.
    # Bayesian modelling
    "pymc>=6.1.0",
    "arviz>=1.2.0",
    # Data engineering
    "xarray>=2026.7.0",
    "netCDF4>=1.7.0",
    "zarr>=3.2.1",
    "gcsfs>=2026.7.0",
    "pandas>=3.0.3",
    "numpy>=2.4.0,<2.5.0",
    "pyarrow>=25.0.0",
    "fastparquet>=2024.11.0",
    "scipy>=1.18.0",
    # Config & utilities
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "tqdm>=4.67.0",
    "requests>=2.34.2",
    # Visualisation
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.0",
    # Interactive simulation app (make app) and Plotly chart builders
    "streamlit>=1.66.0",
    "plotly>=6.0.0",
    # Statistics (OLS baseline for the climate feedback module)
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
